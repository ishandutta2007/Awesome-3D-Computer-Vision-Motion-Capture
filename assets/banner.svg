<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8; #818cf8; #c084fc; #38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8; #c084fc; #38bdf8; #818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc; #38bdf8; #818cf8; #c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="accentCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.8" />
    </linearGradient>

    <radialGradient id="glowPulse1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25">
        <animate attributeName="stop-opacity" values="0.15;0.35;0.15" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPulse2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.22">
        <animate attributeName="stop-opacity" values="0.25;0.12;0.25" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.4" />
    </pattern>

    <!-- Filter for subtle drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(1deg); }
    }
    @keyframes pulseNode {
      0%, 100% { r: 3.5px; opacity: 0.9; }
      50% { r: 5.5px; opacity: 0.4; }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }
    .node-pulse {
      animation: pulseNode 3s infinite ease-in-out;
    }
    .grid-line {
      stroke-dasharray: 6, 6;
      animation: dashMove 12s linear infinite;
    }
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .body-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Grid Layer -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Ambient Glow Orbs in Background -->
  <circle cx="200" cy="120" r="280" fill="url(#glowPulse1)" />
  <circle cx="1020" cy="280" r="260" fill="url(#glowPulse2)" />

  <!-- DYNAMIC / ANIMATED 3D KINEMATIC SKELETAL RIG (Right/Background Decoration) -->
  <g transform="translate(860, 60)" opacity="0.85">
    <!-- Perspective Horizon Ellipse -->
    <ellipse cx="140" cy="270" rx="140" ry="38" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="4,4"/>
    <ellipse cx="140" cy="270" rx="90" ry="24" fill="none" stroke="#818cf8" stroke-width="1" stroke-opacity="0.25"/>

    <!-- Coordinate Axes -->
    <line x1="140" y1="270" x2="230" y2="295" stroke="#ef4444" stroke-width="1.8" opacity="0.7"/> <!-- X: Red -->
    <line x1="140" y1="270" x2="140" y2="180" stroke="#22c55e" stroke-width="1.8" opacity="0.7"/> <!-- Y: Green -->
    <line x1="140" y1="270" x2="60" y2="295" stroke="#3b82f6" stroke-width="1.8" opacity="0.7"/>  <!-- Z: Blue -->
    <text x="235" y="300" fill="#ef4444" font-size="11" font-family="monospace" opacity="0.8">X</text>
    <text x="135" y="172" fill="#22c55e" font-size="11" font-family="monospace" opacity="0.8">Y</text>
    <text x="46" y="300" fill="#3b82f6" font-size="11" font-family="monospace" opacity="0.8">Z</text>

    <!-- Animated Pose Nodes & Bones -->
    <!-- Head to Neck -->
    <line x1="140" y1="50" x2="140" y2="80" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Spine to Pelvis -->
    <line x1="140" y1="80" x2="140" y2="160" stroke="#818cf8" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Shoulders -->
    <line x1="100" y1="95" x2="180" y2="95" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Left Arm -->
    <line x1="100" y1="95" x2="65" y2="135" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="65" y1="135" x2="45" y2="180" stroke="#06b6d4" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Right Arm (Raised / Active Pose) -->
    <line x1="180" y1="95" x2="220" y2="125" stroke="#c084fc" stroke-width="2" stroke-linecap="round"/>
    <line x1="220" y1="125" x2="245" y2="85" stroke="#e879f9" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Pelvis Bar -->
    <line x1="115" y1="160" x2="165" y2="160" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Left Leg -->
    <line x1="115" y1="160" x2="105" y2="215" stroke="#6366f1" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="105" y1="215" x2="100" y2="270" stroke="#4f46e5" stroke-width="2" stroke-linecap="round"/>

    <!-- Right Leg (Dynamic step forward) -->
    <line x1="165" y1="160" x2="185" y2="210" stroke="#818cf8" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="185" y1="210" x2="195" y2="265" stroke="#a855f7" stroke-width="2" stroke-linecap="round"/>

    <!-- Joints (Circles with subtle pulses) -->
    <circle cx="140" cy="45" r="10" fill="#38bdf8" fill-opacity="0.85"/>
    <circle cx="140" cy="80" r="4" fill="#67e8f9" class="node-pulse"/>
    <circle cx="100" cy="95" r="4" fill="#67e8f9"/>
    <circle cx="180" cy="95" r="4" fill="#c084fc"/>
    <circle cx="65" cy="135" r="3.5" fill="#38bdf8"/>
    <circle cx="45" cy="180" r="3.5" fill="#06b6d4"/>
    <circle cx="220" cy="125" r="3.5" fill="#c084fc"/>
    <circle cx="245" cy="85" r="4" fill="#e879f9" class="node-pulse"/>
    <circle cx="140" cy="160" r="4" fill="#818cf8"/>
    <circle cx="115" cy="160" r="3.5" fill="#818cf8"/>
    <circle cx="165" cy="160" r="3.5" fill="#a855f7"/>
    <circle cx="105" cy="215" r="3.5" fill="#6366f1"/>
    <circle cx="100" cy="270" r="4" fill="#38bdf8"/>
    <circle cx="185" cy="210" r="3.5" fill="#818cf8"/>
    <circle cx="195" cy="265" r="4" fill="#c084fc"/>

    <!-- Mesh Wireframe Poly Overlay -->
    <polygon points="100,95 180,95 165,160 115,160" fill="#38bdf8" fill-opacity="0.08" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.3"/>
    <polygon points="140,80 180,95 140,160" fill="#818cf8" fill-opacity="0.06"/>
    <polygon points="140,80 100,95 140,160" fill="#818cf8" fill-opacity="0.06"/>
  </g>

  <!-- FOREGROUND CONTENT: Guaranteed clarity, high contrast, crisp typography -->
  <g transform="translate(60, 50)" filter="url(#shadow)">
    <!-- Top Pill / Status Tag -->
    <g transform="translate(0, 10)">
      <rect width="265" height="30" rx="15" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="15" r="5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="20" fill="#94a3b8" font-size="12" font-weight="600" class="body-text" letter-spacing="0.5">CURATED ECOSYSTEM • 2026</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="98" fill="url(#primaryTextGrad)" font-size="44" class="title-text">
      Awesome 3D Computer Vision
    </text>
    <text x="0" y="146" fill="#f8fafc" font-size="42" class="title-text">
      &amp; Motion Capture
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="192" fill="#94a3b8" font-size="18" font-weight="400" class="body-text">
      The authoritative index of Markerless AI MoCap, Human Mesh Recovery (HMR),
    </text>
    <text x="0" y="218" fill="#64748b" font-size="16" font-weight="400" class="body-text">
      Multi-View Triangulation, Kinematic Solvers &amp; Video Character Replacement.
    </text>

    <!-- Feature Pills / Badges in Foreground -->
    <g transform="translate(0, 248)" filter="url(#badgeShadow)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="34" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1.2"/>
      <text x="14" y="22" fill="#38bdf8" font-size="13" font-weight="600" class="body-text">⚡ Markerless AI</text>

      <!-- Pill 2 -->
      <rect x="142" y="0" width="135" height="34" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="1.2"/>
      <text x="156" y="22" fill="#818cf8" font-size="13" font-weight="600" class="body-text">📐 SMPL / SMPL-X</text>

      <!-- Pill 3 -->
      <rect x="289" y="0" width="150" height="34" rx="8" fill="#0f172a" stroke="#9333ea" stroke-width="1.2"/>
      <text x="303" y="22" fill="#c084fc" font-size="13" font-weight="600" class="body-text">🎬 Actor Swap VFX</text>

      <!-- Pill 4 -->
      <rect x="451" y="0" width="145" height="34" rx="8" fill="#0f172a" stroke="#059669" stroke-width="1.2"/>
      <text x="465" y="22" fill="#34d399" font-size="13" font-weight="600" class="body-text">📊 Biomechanics</text>
    </g>
  </g>
</svg>
